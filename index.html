<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI FaceID - Final Stable</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        body { 
            background: var(--bg); 
            color: white; 
            height: 100vh; /* Full height cố định */
            display: flex; 
            flex-direction: column; 
            overflow: hidden; /* Chặn scroll trang */
        }

        /* --- 1. TOP HEADER --- */
        .app-header {
            padding: 15px;
            background: var(--surface);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #334155;
            flex-shrink: 0; /* Không bị co lại */
        }
        .brand { font-weight: 800; color: var(--primary); font-size: 18px; }
        .status-pill {
            font-size: 12px; padding: 4px 10px; border-radius: 20px;
            background: #334155; color: #94a3b8; font-weight: 600;
            transition: 0.3s;
        }
        .status-pill.scanning { background: var(--warning); color: #000; animation: pulse 1.5s infinite; }
        .status-pill.locked { background: var(--success); color: white; }

        @keyframes pulse { 0% { opacity: 0.7; } 50% { opacity: 1; } 100% { opacity: 0.7; } }

        /* --- 2. CAMERA AREA (AUTO FLEX CENTER) --- */
        .camera-container {
            flex: 1; /* Chiếm toàn bộ khoảng trống còn lại */
            position: relative;
            background: #000;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%; /* Full container */
            display: flex; justify-content: center; align-items: center;
        }

        /* Video & Canvas: Fit Contain để không bị cắt hình */
        video {
            max-width: 100%; max-height: 100%;
            width: auto; height: auto;
            transform: scaleX(-1);
            display: block;
        }
        canvas {
            position: absolute;
            top: 50%; left: 50%; /* Căn giữa tuyệt đối */
            transform: translate(-50%, -50%) scaleX(-1); /* Offset lại để trùng video */
        }

        /* UI OVERLAYS */
        .scan-radar {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 250px; height: 250px;
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            display: none; /* Hiện khi Searching */
        }
        .scan-radar::after {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            border-top: 2px solid var(--primary);
            animation: radar-spin 2s linear infinite;
        }
        @keyframes radar-spin { to { transform: rotate(360deg); } }

        .liveness-badge {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: white;
            padding: 8px 16px; border-radius: 30px; font-size: 13px; font-weight: 600;
            border: 1px solid rgba(255,255,255,0.2);
            opacity: 0; transition: 0.3s; pointer-events: none;
        }
        .liveness-badge.show { opacity: 1; top: 30px; }

        /* --- 3. FIX: INFO PANEL (NO OVERLAP) --- */
        .info-panel {
            position: absolute; 
            bottom: 20px; left: 20px; right: 20px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 16px;
            border-left: 6px solid var(--success);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            
            /* Animation */
            transform: translateY(150%); /* Ẩn xuống dưới */
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex; flex-direction: column; gap: 8px; /* Xếp dọc các dòng */
        }

        .info-panel.show { transform: translateY(0); }
        .info-panel.error { border-left-color: var(--danger); }

        /* Typography Fix */
        .user-name { 
            font-size: 20px; font-weight: 800; color: white; 
            margin-bottom: 4px; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; /* Cắt chữ nếu quá dài */
        }
        
        /* Row style cho từng dòng thông tin -> Tránh đè nhau */
        .info-row {
            display: flex; align-items: center; gap: 10px;
            color: #cbd5e1; font-size: 14px;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .info-row:last-child { border-bottom: none; }
        .info-row i { width: 20px; text-align: center; color: var(--primary); }

        /* --- 4. BOTTOM CONTROLS --- */
        .controls {
            padding: 15px; background: var(--surface);
            flex-shrink: 0;
            display: flex; flex-direction: column; gap: 10px;
        }
        
        .main-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn {
            border: none; padding: 14px; border-radius: 12px;
            font-weight: 700; color: white; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-start { background: var(--primary); }
        .btn-stop { background: var(--danger); }

        .settings-bar { display: flex; justify-content: space-between; align-items: center; color: #94a3b8; font-size: 13px; }
        
        /* Loader */
        .loader { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #334155; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { to {transform: rotate(360deg);} }
    </style>
</head>
<body>

    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p style="margin-top: 15px; color: #94a3b8;">Đang tải Model AI...</p>
    </div>

    <div class="app-header">
        <div class="brand"><i class="fas fa-scan"></i> FaceID Pro</div>
        <div class="status-pill" id="systemStatus">Sẵn sàng</div>
    </div>

    <div class="camera-container">
        <div class="video-wrapper">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="overlay"></canvas>
            
            <div class="scan-radar" id="radar"></div>

            <div class="liveness-badge" id="livenessBadge">
                <i class="far fa-eye"></i> Vui lòng chớp mắt
            </div>

            <div class="info-panel" id="infoPanel">
                </div>
        </div>
    </div>

    <div class="controls">
        <div class="main-btns">
            <button class="btn btn-start" id="startBtn" disabled onclick="toggleSystem(true)">
                <i class="fas fa-play"></i> Bắt đầu
            </button>
            <button class="btn btn-stop" id="stopBtn" disabled onclick="toggleSystem(false)">
                <i class="fas fa-stop"></i> Dừng
            </button>
        </div>
        
        <div class="settings-bar">
            <label style="display: flex; align-items: center; gap: 5px;">
                <input type="checkbox" id="livenessCheck" checked> Chống giả mạo
            </label>
            <button onclick="document.getElementById('fileInput').click()" style="background:none; border:none; color: var(--primary); cursor: pointer;">
                <i class="fas fa-file-import"></i> Nhập Data (<span id="dbCount">0</span>)
            </button>
            <input type="file" id="fileInput" hidden accept=".json" onchange="importData(this)">
        </div>
    </div>

    <script>
        const CONFIG = {
            MODEL_URL: 'https://cdn.jsdelivr.net/gh/cgarciagl/face-api.js@0.22.2/weights',
            DETECTOR: new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }),
            MATCH_THRESHOLD: 0.5,
            BLINK_THRESHOLD: 0.28
        };

        let state = {
            db: null, faceMatcher: null, users: [],
            isRunning: false, loopId: null, blinkDetected: false,
            noFaceTimer: null
        };

        const video = document.getElementById('video');
        const canvas = document.getElementById('overlay');
        const infoPanel = document.getElementById('infoPanel');
        const statusBadge = document.getElementById('systemStatus');
        const radar = document.getElementById('radar');
        const livenessBadge = document.getElementById('livenessBadge');

        // --- DATABASE ---
        async function initDB() {
            return new Promise(resolve => {
                const req = indexedDB.open('FaceID_Final_Fix', 1);
                req.onupgradeneeded = e => {
                    const db = e.target.result;
                    if(!db.objectStoreNames.contains('profiles')) db.createObjectStore('profiles', { keyPath: 'name' });
                };
                req.onsuccess = e => {
                    state.db = e.target.result;
                    loadUsers();
                    resolve();
                };
            });
        }

        function loadUsers() {
            state.db.transaction('profiles', 'readonly').objectStore('profiles').getAll().onsuccess = e => {
                state.users = e.target.result;
                document.getElementById('dbCount').innerText = state.users.length;
                if(state.users.length) {
                    const labeled = state.users.map(u => new faceapi.LabeledFaceDescriptors(u.name, u.descriptors.map(d => new Float32Array(d))));
                    state.faceMatcher = new faceapi.FaceMatcher(labeled, CONFIG.MATCH_THRESHOLD);
                }
            };
        }

        function importData(input) {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const data = JSON.parse(e.target.result);
                    const des = data.records.filter(r => r.descriptor).map(r => new Float32Array(Object.values(r.descriptor)));
                    if(des.length) {
                        state.db.transaction('profiles', 'readwrite').objectStore('profiles').put({...data.user_profile, descriptors: des});
                        alert("✅ Nhập dữ liệu thành công!");
                        loadUsers();
                    }
                } catch(err) { alert("Lỗi file JSON"); }
            };
            reader.readAsText(file);
        }

        // --- INIT AI ---
        async function init() {
            await initDB();
            await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri(CONFIG.MODEL_URL),
                faceapi.nets.faceLandmark68TinyNet.loadFromUri(CONFIG.MODEL_URL),
                faceapi.nets.faceRecognitionNet.loadFromUri(CONFIG.MODEL_URL)
            ]);

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('startBtn').disabled = false;
                };
            } catch (err) { alert("Lỗi Camera: " + err.message); }
        }

        // --- SYSTEM CONTROL ---
        function toggleSystem(active) {
            state.isRunning = active;
            document.getElementById('startBtn').disabled = active;
            document.getElementById('stopBtn').disabled = !active;
            
            if(active) {
                radar.style.display = 'block';
                statusBadge.innerText = "Đang quét...";
                statusBadge.className = "status-pill scanning";
                runLoop();
            } else {
                cancelAnimationFrame(state.loopId);
                canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
                resetToIdle();
            }
        }

        // --- LOGIC DETECT ---
        function getEAR(eye) {
            const d1 = Math.hypot(eye[1].x - eye[5].x, eye[1].y - eye[5].y);
            const d2 = Math.hypot(eye[2].x - eye[4].x, eye[2].y - eye[4].y);
            const d3 = Math.hypot(eye[0].x - eye[3].x, eye[0].y - eye[3].y);
            return (d1 + d2) / (2 * d3);
        }

        async function runLoop() {
            if(!state.isRunning) return;

            if(video.videoWidth === 0) {
                state.loopId = requestAnimationFrame(runLoop);
                return;
            }

            // Fix kích thước hiển thị
            const displaySize = { width: video.videoWidth, height: video.videoHeight };
            faceapi.matchDimensions(canvas, displaySize);

            // Detect
            const detections = await faceapi.detectAllFaces(video, CONFIG.DETECTOR)
                .withFaceLandmarks(true).withFaceDescriptors();
            
            const resized = faceapi.resizeResults(detections, displaySize);
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const useLiveness = document.getElementById('livenessCheck').checked;

            // --- TRƯỜNG HỢP CÓ MẶT ---
            if(resized.length > 0) {
                // Tắt Radar
                radar.style.display = 'none';
                statusBadge.innerText = "Phát hiện khuôn mặt";
                statusBadge.className = "status-pill locked";

                const d = resized[0];
                const box = d.detection.box;
                let isReal = false;

                // 1. Kiểm tra Liveness
                if(useLiveness) {
                    const ear = (getEAR(d.landmarks.getLeftEye()) + getEAR(d.landmarks.getRightEye()))/2;
                    if(ear < CONFIG.BLINK_THRESHOLD) state.blinkDetected = true;

                    if(state.blinkDetected) {
                        isReal = true;
                        showLivenessBadge(true);
                    } else {
                        showLivenessBadge(false);
                    }
                } else {
                    isReal = true;
                    livenessBadge.classList.remove('show');
                }

                // 2. Vẽ khung
                new faceapi.draw.DrawBox(box, {
                    label: " ", boxColor: isReal ? '#10b981' : '#f59e0b', lineWidth: 2
                }).draw(canvas);

                // 3. Nhận diện (Chỉ khi Real)
                if(isReal && state.faceMatcher) {
                    const match = state.faceMatcher.findBestMatch(d.descriptor);
                    showInfoResult(match.label);
                }

            } 
            // --- TRƯỜNG HỢP KHÔNG CÓ MẶT (FIX THEO YÊU CẦU) ---
            else {
                // Bật lại Radar
                radar.style.display = 'block';
                statusBadge.innerText = "Đang tìm kiếm...";
                statusBadge.className = "status-pill scanning";
                
                // Ẩn bảng thông tin
                infoPanel.classList.remove('show');
                livenessBadge.classList.remove('show');
                
                // Reset trạng thái
                state.blinkDetected = false;
            }

            state.loopId = requestAnimationFrame(runLoop);
        }

        // --- HELPERS HIỂN THỊ ---
        function showLivenessBadge(success) {
            livenessBadge.classList.add('show');
            if(success) {
                livenessBadge.innerHTML = '<i class="fas fa-check"></i> Xác thực OK';
                livenessBadge.style.color = 'var(--success)';
                livenessBadge.style.borderColor = 'var(--success)';
            } else {
                livenessBadge.innerHTML = '<i class="far fa-eye"></i> Hãy chớp mắt';
                livenessBadge.style.color = 'white';
                livenessBadge.style.borderColor = 'rgba(255,255,255,0.2)';
            }
        }

        // FIX CSS OVERLAP: Inject HTML dạng dòng
        function showInfoResult(label) {
            // Nếu đang hiện rồi thì thôi, tránh render lại liên tục gây giật
            if (infoPanel.dataset.currentUser === label && infoPanel.classList.contains('show')) return;
            
            infoPanel.dataset.currentUser = label;
            infoPanel.classList.add('show');

            if(label === 'unknown') {
                infoPanel.className = 'info-panel show error';
                infoPanel.innerHTML = `
                    <div class="user-name">CẢNH BÁO: NGƯỜI LẠ</div>
                    <div class="info-row">
                        <i class="fas fa-exclamation-triangle"></i> <span>Không có dữ liệu trong hệ thống.</span>
                    </div>
                `;
                speak("Cảnh báo");
            } else {
                const user = state.users.find(u => u.name === label);
                if(user) {
                    infoPanel.className = 'info-panel show';
                    // Layout dòng dọc, đảm bảo không bao giờ đè chữ
                    infoPanel.innerHTML = `
                        <div class="user-name">${user.name}</div>
                        <div class="info-row">
                            <i class="fas fa-id-badge"></i> <span>ID: ${user.id}</span>
                        </div>
                        <div class="info-row">
                            <i class="fas fa-layer-group"></i> <span>Đơn vị: ${user.class}</span>
                        </div>
                        <div class="info-row" style="color: var(--success); font-weight: 600;">
                            <i class="fas fa-check-circle"></i> <span>Điểm danh thành công</span>
                        </div>
                    `;
                    speak("Xin chào " + user.name);
                }
            }
        }

        function resetToIdle() {
            radar.style.display = 'none';
            statusBadge.innerText = "Sẵn sàng";
            statusBadge.className = "status-pill";
            infoPanel.classList.remove('show');
            livenessBadge.classList.remove('show');
        }

        let lastSpeak = 0;
        function speak(txt) {
            const now = Date.now();
            if(now - lastSpeak > 4000) {
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(txt));
                lastSpeak = now;
            }
        }

        init();
    </script>
</body>
</html>
