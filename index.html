<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống học tiếng Xơ Đăng cho học sinh THCS</title>
    
    <meta name="description" content="Hệ thống học tiếng Xơ Đăng trực tuyến dành riêng cho học sinh THCS. Từ điển tương tác, bài học sinh động, trắc nghiệm thông minh. Ứng dụng PWA học offline miễn phí.">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Splash Screen */
        #splash-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
        }

        .splash-logo-container {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: white;
            border: 6px solid #059669;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            animation: pulse 2s infinite ease-in-out;
        }

        .splash-logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            padding: 10px;
        }

        .splash-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #111827;
            margin-bottom: 15px;
            line-height: 1.3;
            max-width: 700px;
        }

        .splash-subtitle {
            font-size: 1.1rem;
            color: #374151;
            margin-bottom: 50px;
            font-weight: 500;
            max-width: 600px;
        }

        .progress-container {
            width: 280px;
            height: 8px;
            background: rgba(5, 150, 105, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #059669, #10b981);
            border-radius: 4px;
            animation: loadingFill 3.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .splash-loading-text {
            font-size: 0.9rem;
            color: #6b7280;
            margin-top: 20px;
        }

        @keyframes loadingFill {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-logo-container">
            <img src="https://raw.githubusercontent.com/tudienxedang/tudien/main/twitter-card.png" 
                 alt="Logo Hệ thống học tiếng Xơ Đăng" 
                 class="splash-logo-img">
        </div>
        
        <h1 class="splash-title">Hệ thống hỗ trợ học tiếng Xơ Đăng</h1>
        <div class="splash-subtitle">Trên nền tảng PWA cho học sinh THCS</div>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        
        <p class="splash-loading-text">Đang chuyển đến ứng dụng...</p>
    </div>

    <script>
        // Sau 3.5 giây chuyển thẳng đến ứng dụng chính
        setTimeout(() => {
            window.location.replace("https://tudienxedang.github.io/tudien/?verified=true");
        }, 3500);
    </script>
</body>
</html>
