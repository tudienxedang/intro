<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>AI FaceID - Cloud Sync</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <style>
        /* GIỮ NGUYÊN CSS CŨ VÀ THÊM RESPONSIVE FIXES */
        :root { --bg: #0f172a; --surface: #1e293b; --primary: #3b82f6; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: white; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        /* HEADER - FIX CHIỀU CAO CỐ ĐỊNH */
        .app-header { 
            padding: 12px 16px; 
            background: var(--surface); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #334155; 
            flex-shrink: 0; 
            min-height: 60px;
        }
        .brand { 
            font-weight: 800; 
            color: var(--primary); 
            font-size: clamp(16px, 4vw, 18px);
            white-space: nowrap;
        }
        .status-pill { 
            font-size: 11px; 
            padding: 6px 12px; 
            border-radius: 20px; 
            background: #334155; 
            color: #94a3b8; 
            font-weight: 600; 
            transition: 0.3s; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            white-space: nowrap;
            min-width: max-content;
        }
        .status-pill.scanning { background: var(--warning); color: #000; animation: pulse 1.5s infinite; }
        .status-pill.locked { background: var(--success); color: white; }
        .status-pill.syncing { background: var(--primary); color: white; }
        @keyframes pulse { 0% { opacity: 0.7; } 50% { opacity: 1; } 100% { opacity: 0.7; } }

        /* CAMERA AREA - FIX QUAN TRỌNG NHẤT */
        .camera-container { 
            flex: 1; 
            position: relative; 
            background: #000; 
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .video-wrapper { 
            position: relative; 
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video { 
            width: 100%;
            height: auto;
            max-height: 100%;
            object-fit: contain;
            transform: scaleX(-1);
            display: block;
        }
        canvas { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            transform: scaleX(-1);
        }

        /* UI OVERLAYS */
        .scan-radar { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            width: min(250px, 70vw); 
            height: min(250px, 70vw); 
            border: 2px solid rgba(59, 130, 246, 0.3); 
            border-radius: 50%; 
            display: none; 
        }
        .scan-radar::after { 
            content: ''; 
            position: absolute; 
            inset: 0; 
            border-radius: 50%; 
            border-top: 2px solid var(--primary); 
            animation: radar-spin 2s linear infinite; 
        }
        @keyframes radar-spin { to { transform: rotate(360deg); } }

        .liveness-badge { 
            position: absolute; 
            top: 10px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(0,0,0,0.8); 
            color: white; 
            padding: 8px 16px; 
            border-radius: 30px; 
            font-size: clamp(12px, 3vw, 13px); 
            font-weight: 600; 
            border: 1px solid rgba(255,255,255,0.2); 
            opacity: 0; 
            transition: 0.3s; 
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
            max-width: 90%;
            text-overflow: ellipsis;
            overflow: hidden;
        }
        .liveness-badge.show { 
            opacity: 1; 
            top: 20px; 
        }

        /* INFO PANEL - FIX VỊ TRÍ TRÊN MOBILE */
        .info-panel { 
            position: absolute; 
            bottom: 10px; 
            left: 10px; 
            right: 10px; 
            background: rgba(15, 23, 42, 0.95); 
            backdrop-filter: blur(10px); 
            border-radius: 12px; 
            padding: 14px; 
            border-left: 6px solid var(--success); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); 
            transform: translateY(150%); 
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); 
            display: flex; 
            flex-direction: column; 
            gap: 6px;
            z-index: 10;
            max-height: 40vh;
            overflow-y: auto;
        }
        .info-panel.show { transform: translateY(0); }
        .info-panel.error { border-left-color: var(--danger); }
        .user-name { 
            font-size: clamp(16px, 4vw, 20px); 
            font-weight: 800; 
            color: white; 
            margin-bottom: 2px; 
            white-space: normal;
            word-break: break-word;
        }
        .info-row { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            color: #cbd5e1; 
            font-size: clamp(12px, 3vw, 14px); 
            padding: 4px 0; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            line-height: 1.3;
        }
        .info-row:last-child { border-bottom: none; }
        .info-row i { 
            width: 18px; 
            text-align: center; 
            color: var(--primary); 
            flex-shrink: 0;
        }

        /* CONTROLS - TĂNG KÍCH THƯỚC NÚT TRÊN MOBILE */
        .controls { 
            padding: 12px 16px; 
            background: var(--surface); 
            flex-shrink: 0; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            border-top: 1px solid #334155;
        }
        .main-btns { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
        }
        .btn { 
            border: none; 
            padding: clamp(12px, 4vw, 14px); 
            border-radius: 10px; 
            font-weight: 700; 
            color: white; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            font-size: clamp(14px, 4vw, 16px);
            min-height: 48px;
            touch-action: manipulation;
        }
        .btn:active { 
            transform: scale(0.98); 
            background-color: rgba(0,0,0,0.1);
        }
        .btn:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
        }
        .btn-start { background: var(--primary); }
        .btn-stop { background: var(--danger); }
        
        .settings-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            color: #94a3b8; 
            font-size: clamp(12px, 3vw, 13px);
            flex-wrap: wrap;
            gap: 8px;
        }
        
        /* CHECKBOX TÙY CHỈNH CHO MOBILE */
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }
        .checkbox-container input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }
        
        .sync-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: clamp(12px, 3vw, 13px);
            padding: 6px 8px;
            border-radius: 6px;
            transition: background-color 0.2s;
        }
        .sync-btn:active {
            background-color: rgba(59, 130, 246, 0.1);
        }
        
        .loader { 
            position: fixed; 
            inset: 0; 
            background: var(--bg); 
            z-index: 9999; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }
        .spinner { 
            width: 40px; 
            height: 40px; 
            border: 4px solid #334155; 
            border-top-color: var(--primary); 
            border-radius: 50%; 
            animation: spin 1s infinite linear; 
        }
        @keyframes spin { to {transform: rotate(360deg);} }
        
        /* MEDIA QUERIES CHO THIẾT BỊ RẤT NHỎ */
        @media (max-width: 320px) {
            .app-header { padding: 10px 12px; }
            .controls { padding: 10px 12px; }
            .info-panel { padding: 12px; }
            .btn { min-height: 44px; }
        }
        
        @media (max-height: 600px) {
            .liveness-badge { top: 5px; }
            .info-panel { bottom: 5px; max-height: 35vh; }
        }
        
        /* LANDSCAPE MODE FIX */
        @media (orientation: landscape) and (max-height: 500px) {
            .camera-container { 
                flex: 1 1 auto;
                min-height: 60vh;
            }
            .controls {
                flex-direction: row;
                align-items: center;
                padding: 8px 16px;
            }
            .main-btns {
                grid-template-columns: 1fr;
                gap: 6px;
                min-width: 120px;
            }
            .settings-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
            .info-panel {
                max-height: 30vh;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p style="margin-top: 15px; color: #94a3b8; text-align: center; padding: 0 20px;">
            Đang tải Model AI...
        </p>
    </div>

    <div class="app-header">
        <div class="brand"><i class="fas fa-scan"></i> FaceID Pro</div>
        <div class="status-pill" id="systemStatus">Sẵn sàng</div>
    </div>

    <div class="camera-container">
        <div class="video-wrapper">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="overlay"></canvas>
            
            <div class="scan-radar" id="radar"></div>

            <div class="liveness-badge" id="livenessBadge">
                <i class="far fa-eye"></i> Vui lòng chớp mắt
            </div>

            <div class="info-panel" id="infoPanel"></div>
        </div>
    </div>

    <div class="controls">
        <div class="main-btns">
            <button class="btn btn-start" id="startBtn" disabled onclick="toggleSystem(true)">
                <i class="fas fa-play"></i> Bắt đầu
            </button>
            <button class="btn btn-stop" id="stopBtn" disabled onclick="toggleSystem(false)">
                <i class="fas fa-stop"></i> Dừng
            </button>
        </div>
        
        <div class="settings-bar">
            <label class="checkbox-container">
                <input type="checkbox" id="livenessCheck" checked> 
                <span>Chống giả mạo</span>
            </label>
            
            <button class="sync-btn" onclick="syncDataFromDrive()">
                <i class="fas fa-sync-alt"></i> Đồng bộ Drive (<span id="dbCount">0</span>)
            </button>
        </div>
    </div>

    <script>
        // ========================================================
        // CẤU HÌNH (DÁN URL GOOGLE WEB APP VÀO ĐÂY)
        // ========================================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbwp5wxyR_ZV-1TMelVPGDLFNKAqfWd1ZjT43tJejXdUD2JRM4AUok0q53WeegmoNa0qQg/exec'; 
        // ========================================================

        const CONFIG = {
            MODEL_URL: 'https://cdn.jsdelivr.net/gh/cgarciagl/face-api.js@0.22.2/weights',
            DETECTOR: new faceapi.TinyFaceDetectorOptions({ 
                inputSize: window.innerWidth < 768 ? 160 : 320, 
                scoreThreshold: 0.5 
            }),
            MATCH_THRESHOLD: 0.5,
            BLINK_THRESHOLD: 0.28
        };

        let state = {
            db: null, faceMatcher: null, users: [],
            isRunning: false, loopId: null, blinkDetected: false,
            noFaceTimer: null
        };

        const video = document.getElementById('video');
        const canvas = document.getElementById('overlay');
        const infoPanel = document.getElementById('infoPanel');
        const statusBadge = document.getElementById('systemStatus');
        const radar = document.getElementById('radar');
        const livenessBadge = document.getElementById('livenessBadge');

        // --- DATABASE INIT ---
        async function initDB() {
            return new Promise(resolve => {
                const req = indexedDB.open('FaceID_Cloud_Sync', 1);
                req.onupgradeneeded = e => {
                    const db = e.target.result;
                    if(!db.objectStoreNames.contains('profiles')) db.createObjectStore('profiles', { keyPath: 'name' });
                };
                req.onsuccess = e => {
                    state.db = e.target.result;
                    loadUsers(); // Load dữ liệu cũ trước để dùng ngay
                    resolve();
                };
            });
        }

        function loadUsers() {
            state.db.transaction('profiles', 'readonly').objectStore('profiles').getAll().onsuccess = e => {
                state.users = e.target.result;
                document.getElementById('dbCount').innerText = state.users.length;
                if(state.users.length) {
                    const labeled = state.users.map(u => new faceapi.LabeledFaceDescriptors(u.name, u.descriptors.map(d => new Float32Array(d))));
                    state.faceMatcher = new faceapi.FaceMatcher(labeled, CONFIG.MATCH_THRESHOLD);
                }
            };
        }

        // --- TÍNH NĂNG MỚI: ĐỒNG BỘ TỪ GOOGLE DRIVE ---
        async function syncDataFromDrive() {
            if (API_URL.includes("DÁN_URL")) {
                console.log("⚠️ Chưa cấu hình URL Google Script.");
                return;
            }

            statusBadge.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang tải dữ liệu Cloud...';
            statusBadge.className = "status-pill syncing";

            try {
                // 1. Gọi Google Script (Hàm doGet)
                const response = await fetch(API_URL);
                const cloudData = await response.json();

                if (!Array.isArray(cloudData)) throw new Error("Dữ liệu trả về lỗi");

                // 2. Lưu vào IndexedDB
                const tx = state.db.transaction('profiles', 'readwrite');
                const store = tx.objectStore('profiles');

                let count = 0;
                for (const user of cloudData) {
                    // Chuyển Descriptor về Float32Array
                    const des = user.records
                        .filter(r => r.descriptor)
                        .map(r => new Float32Array(Object.values(r.descriptor)));
                    
                    if (des.length > 0) {
                        store.put({
                            ...user.user_profile,
                            descriptors: des,
                            timestamp: Date.now()
                        });
                        count++;
                    }
                }

                tx.oncomplete = () => {
                    console.log(`✅ Đã đồng bộ ${count} người từ Google Drive.`);
                    loadUsers(); // Refresh lại bộ nhớ nhận diện
                    statusBadge.innerText = "Đã đồng bộ xong";
                    statusBadge.className = "status-pill locked";
                    setTimeout(() => {
                        statusBadge.innerText = "Sẵn sàng";
                        statusBadge.className = "status-pill";
                    }, 2000);
                };

            } catch (err) {
                console.error("Lỗi Sync:", err);
                statusBadge.innerText = "Lỗi đồng bộ";
                statusBadge.className = "status-pill";
                alert("Không thể tải dữ liệu từ Drive. Kiểm tra kết nối mạng.");
            }
        }

        // --- INIT SYSTEM ---
        async function init() {
            await initDB();
            
            // Tự động đồng bộ ngay khi mở App
            syncDataFromDrive();

            await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri(CONFIG.MODEL_URL),
                faceapi.nets.faceLandmark68TinyNet.loadFromUri(CONFIG.MODEL_URL),
                faceapi.nets.faceRecognitionNet.loadFromUri(CONFIG.MODEL_URL)
            ]);

            try {
                const constraints = {
                    video: { 
                        facingMode: 'user',
                        width: { ideal: Math.min(window.innerWidth, 640) },
                        height: { ideal: Math.min(window.innerHeight * 0.7, 480) }
                    } 
                };
                
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    // Điều chỉnh kích thước canvas phù hợp với video
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('startBtn').disabled = false;
                };
            } catch (err) { 
                alert("Lỗi Camera: " + err.message);
                document.getElementById('loader').style.display = 'none';
            }
        }

        // --- CÁC HÀM CŨ GIỮ NGUYÊN ---
        function toggleSystem(active) {
            state.isRunning = active;
            document.getElementById('startBtn').disabled = active;
            document.getElementById('stopBtn').disabled = !active;
            
            if(active) {
                radar.style.display = 'block';
                statusBadge.innerText = "Đang quét...";
                statusBadge.className = "status-pill scanning";
                runLoop();
            } else {
                cancelAnimationFrame(state.loopId);
                canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
                resetToIdle();
            }
        }

        function getEAR(eye) {
            const d1 = Math.hypot(eye[1].x - eye[5].x, eye[1].y - eye[5].y);
            const d2 = Math.hypot(eye[2].x - eye[4].x, eye[2].y - eye[4].y);
            const d3 = Math.hypot(eye[0].x - eye[3].x, eye[0].y - eye[3].y);
            return (d1 + d2) / (2 * d3);
        }

        async function runLoop() {
            if(!state.isRunning) return;

            if(video.videoWidth === 0) {
                state.loopId = requestAnimationFrame(runLoop);
                return;
            }

            const displaySize = { width: video.videoWidth, height: video.videoHeight };
            faceapi.matchDimensions(canvas, displaySize);

            const detections = await faceapi.detectAllFaces(video, CONFIG.DETECTOR)
                .withFaceLandmarks(true).withFaceDescriptors();
            
            const resized = faceapi.resizeResults(detections, displaySize);
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const useLiveness = document.getElementById('livenessCheck').checked;

            if(resized.length > 0) {
                radar.style.display = 'none';
                statusBadge.innerText = "Phát hiện khuôn mặt";
                statusBadge.className = "status-pill locked";

                const d = resized[0];
                const box = d.detection.box;
                let isReal = false;

                if(useLiveness) {
                    const ear = (getEAR(d.landmarks.getLeftEye()) + getEAR(d.landmarks.getRightEye()))/2;
                    if(ear < CONFIG.BLINK_THRESHOLD) state.blinkDetected = true;

                    if(state.blinkDetected) {
                        isReal = true;
                        showLivenessBadge(true);
                    } else {
                        showLivenessBadge(false);
                    }
                } else {
                    isReal = true;
                    livenessBadge.classList.remove('show');
                }

                new faceapi.draw.DrawBox(box, {
                    label: " ", boxColor: isReal ? '#10b981' : '#f59e0b', lineWidth: 2
                }).draw(canvas);

                if(isReal && state.faceMatcher) {
                    const match = state.faceMatcher.findBestMatch(d.descriptor);
                    showInfoResult(match.label);
                }

            } else {
                radar.style.display = 'block';
                statusBadge.innerText = "Đang tìm kiếm...";
                statusBadge.className = "status-pill scanning";
                infoPanel.classList.remove('show');
                livenessBadge.classList.remove('show');
                state.blinkDetected = false;
            }

            state.loopId = requestAnimationFrame(runLoop);
        }

        function showLivenessBadge(success) {
            livenessBadge.classList.add('show');
            if(success) {
                livenessBadge.innerHTML = '<i class="fas fa-check"></i> Xác thực OK';
                livenessBadge.style.color = 'var(--success)';
                livenessBadge.style.borderColor = 'var(--success)';
            } else {
                livenessBadge.innerHTML = '<i class="far fa-eye"></i> Hãy chớp mắt';
                livenessBadge.style.color = 'white';
                livenessBadge.style.borderColor = 'rgba(255,255,255,0.2)';
            }
        }

        function showInfoResult(label) {
            if (infoPanel.dataset.currentUser === label && infoPanel.classList.contains('show')) return;
            
            infoPanel.dataset.currentUser = label;
            infoPanel.classList.add('show');

            if(label === 'unknown') {
                infoPanel.className = 'info-panel show error';
                infoPanel.innerHTML = `
                    <div class="user-name">CẢNH BÁO: NGƯỜI LẠ</div>
                    <div class="info-row">
                        <i class="fas fa-exclamation-triangle"></i> <span>Không có dữ liệu trong hệ thống.</span>
                    </div>
                `;
                speak("Cảnh báo");
            } else {
                const user = state.users.find(u => u.name === label);
                if(user) {
                    infoPanel.className = 'info-panel show';
                    infoPanel.innerHTML = `
                        <div class="user-name">${user.name}</div>
                        <div class="info-row">
                            <i class="fas fa-id-badge"></i> <span>ID: ${user.id}</span>
                        </div>
                        <div class="info-row">
                            <i class="fas fa-layer-group"></i> <span>Đơn vị: ${user.class}</span>
                        </div>
                        <div class="info-row" style="color: var(--success); font-weight: 600;">
                            <i class="fas fa-check-circle"></i> <span>Điểm danh thành công</span>
                        </div>
                    `;
                    speak("Xin chào " + user.name);
                }
            }
        }

        function resetToIdle() {
            radar.style.display = 'none';
            statusBadge.innerText = "Sẵn sàng";
            statusBadge.className = "status-pill";
            infoPanel.classList.remove('show');
            livenessBadge.classList.remove('show');
        }

        let lastSpeak = 0;
        function speak(txt) {
            const now = Date.now();
            if(now - lastSpeak > 4000) {
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(txt));
                lastSpeak = now;
            }
        }

        // Xử lý resize window
        window.addEventListener('resize', function() {
            if (video.videoWidth && video.videoHeight) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }
        });

        init();
    </script>
</body>
</html>
